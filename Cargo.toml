[package]
name = "far1c"
version = "0.9.2"
description = "FAR Manager plugin for 1C:Enterprise artifacts (.epf, .erf, .cf, .cfe, .1cd)"
authors = ["Dmitry Kinash <dv.kinash@gmail.com>"]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/DementorAK/far1c"
readme = "README.md"
keywords = ["far-manager", "1c-enterprise", "plugin", "virtual-filesystem"]
categories = ["filesystem", "development-tools"]
build = "build.rs"

# Use `--features far2l --no-default-features` to build for far2l (Linux/macOS).
# Use `--features far2m --no-default-features` to build for far2m (Linux/macOS).
# Default: far3 (FAR Manager 3, Windows).
[features]
default = ["far3"]
far3 = []   # FAR Manager 3 Plugin API (Windows, wchar_t=u16)
far2l = []  # far2l Plugin API (Linux/macOS, wchar_t=u32)
far2m = []  # far2m Plugin API (Linux/macOS, wchar_t=u32)

[lib]
crate-type = ["cdylib"]

[dependencies]
flate2 = "1.0"
encoding_rs = "0.8"
uuid = { version = "1.3", features = ["v4"] }
widestring = "1.0"
log = "0.4"
chrono = "0.4.44"
memoffset = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
quick-xml = "0.40.1"

# Platform-conditional loggers
[target.'cfg(windows)'.dependencies]
windebug_logger = "0.1"

[target.'cfg(not(windows))'.dependencies]
simple_logger = "4.0"
